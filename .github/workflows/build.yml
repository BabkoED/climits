name: build

# Сборка идёт на настоящем macOS у GitHub, а не на машине разработчика.
# Смысл двойной: во-первых, каждый коммит проверяется компилятором, а не
# надеждой; во-вторых, коллегам достаётся готовый .app из релиза, и им
# не нужны ни Xcode, ни git.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# По минимуму на весь workflow. Право на запись нужно ровно одному шагу -
# приложить архив к релизу, - и он вынесен в отдельную работу ниже.
# Иначе правка в build.sh получала бы право git push в репозиторий,
# который раздаёт людям бинарники.
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    # Сумма считается здесь, а публикуется в другой работе - без выхода
    # работы подстановка в тексте релиза оказалась бы пустой.
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      # Действия закреплены по хешу коммита, а не по подвижному тегу v4.
      # Тег можно перевести на другой коммит, и тогда чужой код попадёт
      # в сборку, которую скачивают люди. Для репозитория, раздающего
      # бинарники, это единственный вход, который стоит закрыть заранее.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Без этого токен остаётся в .git/config на всё время работы.
          persist-credentials: false

      # Логика проверяется до сборки: если разбор ответа API сломан,
      # собранное приложение всё равно показывало бы неверные цифры.
      - name: Проверки логики
        run: ./run-tests.sh

      # Ошибка компилятора уходит в АННОТАЦИЮ, а не только в лог прогона.
      # Причина простая: логи прогона читаются только с токеном, а аннотации
      # к проверке видны кому угодно. Без этого сломанная сборка выглядит
      # как «exit code 1» и ничего больше - чинить приходится вслепую.
      - name: Сборка приложения
        run: |
          if ./build.sh; then exit 0; fi
          for f in build/*.log; do
            [ -f "$f" ] || continue
            msg=$(grep -m 20 -E "error:" "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error file=$f::${msg:-в $f нет строк с error:}"
          done
          exit 1

      # Проверяем, а не печатаем: build.sh не падает, если одна из
      # архитектур не собралась - он честно сообщает и отдаёт вторую.
      # Для сборки, которую скачивают коллеги, это не годится: половина
      # офиса получила бы «программа не может быть открыта».
      - name: Обе архитектуры на месте
        run: |
          ARCHS=$(lipo -archs build/climits.app/Contents/MacOS/climits)
          echo "срезы: $ARCHS"
          for a in arm64 x86_64; do
            case "$ARCHS" in
              *"$a"*) ;;
              *) echo "нет среза $a - такую сборку раздавать нельзя" >&2; exit 1 ;;
            esac
          done

      # Именно ditto, а не zip: zip теряет расширенные атрибуты и права
      # внутри бандла, и распакованное приложение может не запуститься.
      - name: Упаковка
        run: ditto -c -k --sequesterRsrc --keepParent build/climits.app climits.zip

      # Подпись обязана быть. Если ad-hoc отвалилась на раннере, в релиз
      # уйдёт неподписанный бандл, а сумма при этом совпадёт - то есть
      # проверить это человеку нечем. Последствие не косметическое: без
      # подписи система переспрашивает доступ к связке ключей после каждого
      # обновления, и половина офиса решит, что приложение сломалось.
      - name: Подпись на месте
        run: codesign --verify --verbose build/climits.app

      # Контрольная сумма в тексте релиза: приложение не подписано
      # сертификатом Apple, и это единственный способ для человека убедиться,
      # что он скачал то же, что собрал CI.
      - name: Контрольная сумма
        id: sum
        run: |
          SUM=$(shasum -a 256 climits.zip | awk '{print $1}')
          echo "sha256=$SUM" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SUM"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: climits-app
          path: climits.zip

  # Отдельная работа: только она имеет право писать в репозиторий, и она
  # не запускает ни сборку, ни скрипты из репозитория - берёт готовый архив
  # из артефакта.
  release:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: climits-app

      - name: Релиз по тегу
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: climits.zip
          body: |
            Скачай `climits.zip`, распакуй, перетащи `climits.app` в «Программы».

            SHA-256 архива:
            ```
            ${{ needs.macos.outputs.sha256 }}
            ```
            Проверить у себя: `shasum -a 256 climits.zip`


            При первом запуске macOS скажет, что разработчик не подтверждён -
            это ожидаемо: приложение не подписано сертификатом Apple.
            Правый клик по нему → «Открыть» → «Открыть». Один раз.

            Или одной командой:
            `xattr -dr com.apple.quarantine /Applications/climits.app`
